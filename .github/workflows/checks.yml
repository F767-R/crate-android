name: Source checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  javascript:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      # Proves the suite needs no private configuration on a fresh checkout.
      - run: npm run test:clean
      # Build with throwaway values so a broken bundle or stylesheet fails the push.
      # The values are not real credentials and the output is never uploaded.
      - name: Build web bundle
        run: |
          sed 's/replace-with-[a-z0-9-]*/ci-placeholder/g' secrets.example.txt > secrets.txt
          npm run build
      # No private configuration, APK builds, or artifact uploads in this job.
