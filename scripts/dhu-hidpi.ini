; Desktop Head Unit preset: 1080p at 240 dpi.
; Same layout size as the stock 720p/160 dpi preset (1.5x pixels and dpi), but much sharper.
; Run: desktop-head-unit.exe --config <path to this file>
[general]
touch = true
touchpad = false
controller = false
instrumentcluster = false
resolution = 1920x1080
dpi = 240
framerate = 30

[sensors]
location = true
night_mode = true
driving_status = true
