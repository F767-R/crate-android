apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

// Same private build inputs as the web app; never print their values.
def nativeSecretsFile = rootProject.file('../secrets.txt')
def nativeSecrets = project.hasProperty('nativeFixture')
    ? [JELLYFIN_SERVER: 'http://127.0.0.1:18099', JELLYFIN_API_KEY: 'fixture-only']
    : new groovy.json.JsonSlurper().parseText(nativeSecretsFile.getText('UTF-8').replace('\uFEFF', ''))

android {
    namespace "com.yourname.crate"
    compileSdk rootProject.ext.compileSdkVersion
    buildFeatures { compose true; buildConfig true }
    composeOptions { kotlinCompilerExtensionVersion '1.5.15' }
    kotlinOptions { jvmTarget = '17' }
    if (project.hasProperty('nativeFixture')) {
        sourceSets.debug.res.srcDir 'src/nativeFixture/res'
    }
    defaultConfig {
        applicationId "com.yourname.crate"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        buildConfigField 'String', 'JELLYFIN_SERVER', groovy.json.JsonOutput.toJson(nativeSecrets.JELLYFIN_SERVER.trim().replaceAll('/+$', ''))
        buildConfigField 'String', 'JELLYFIN_API_KEY', groovy.json.JsonOutput.toJson(nativeSecrets.JELLYFIN_API_KEY.trim())
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation 'androidx.activity:activity-compose:1.8.2'
    implementation 'androidx.compose.ui:ui:1.6.8'
    implementation 'androidx.compose.foundation:foundation:1.6.8'
    implementation 'androidx.compose.material3:material3:1.2.1'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.6.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.6.2'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'io.coil-kt:coil-compose:2.6.0'
    testImplementation 'org.json:json:20240303'
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4:1.6.8'
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
    implementation "androidx.media:media:1.7.0"

    // Media3 / ExoPlayer — drives actual audio playback so the
    // MediaSession, lockscreen, quick-settings, and Bluetooth headset
    // controls all reflect the real playback state (not a JS guess).
    def media3Version = "1.4.1"
    implementation "androidx.media3:media3-exoplayer:$media3Version"
    implementation "androidx.media3:media3-session:$media3Version"
    implementation "androidx.media3:media3-common:$media3Version"
    implementation "androidx.media3:media3-datasource:$media3Version"
    implementation "androidx.media3:media3-database:$media3Version"
    implementation "androidx.media3:media3-ui:$media3Version"
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
